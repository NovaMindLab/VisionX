<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 框架霓虹渐变 -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 镜片极光渐变 -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- X 晶体光芒渐变 -->
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- 外圈光晕 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角外框图标底座 -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- 科技背景网格点 -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="80" cy="80" r="2.5"/><circle cx="120" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/><circle cx="352" cy="80" r="2.5"/><circle cx="392" cy="80" r="2.5"/><circle cx="432" cy="80" r="2.5"/>
    <circle cx="80" cy="432" r="2.5"/><circle cx="120" cy="432" r="2.5"/><circle cx="160" cy="432" r="2.5"/><circle cx="352" cy="432" r="2.5"/><circle cx="392" cy="432" r="2.5"/><circle cx="432" cy="432" r="2.5"/>
  </g>

  <!-- 智能眼镜本体 -->
  <!-- 左镜框与镜片 -->
  <g id="glasses" filter="url(#glow)">
    <!-- 左镜片填充 -->
    <rect x="74" y="190" width="140" height="120" rx="34" fill="url(#lensGrad)" stroke="none"/>
    <!-- 右镜片填充 -->
    <rect x="298" y="190" width="140" height="120" rx="34" fill="url(#lensGrad)" stroke="none"/>

    <!-- 左镜框边框 -->
    <rect x="74" y="190" width="140" height="120" rx="34" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linejoin="round"/>
    <!-- 右镜框边框 -->
    <rect x="298" y="190" width="140" height="120" rx="34" fill="none" stroke="url(#frameGrad)" stroke-width="12" stroke-linejoin="round"/>

    <!-- 左右眼镜铰链与镜腿延伸 -->
    <path d="M 74 210 L 40 215 C 34 216 30 222 32 228 L 36 244" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 438 210 L 472 215 C 478 216 482 222 480 228 L 476 244" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round"/>

    <!-- 中间鼻梁连接桥 -->
    <path d="M 214 235 C 236 220 276 220 298 235" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- 左镜片：AI 视觉微型光圈感知传感器 (Camera Aperture) -->
    <circle cx="144" cy="250" r="28" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="144" cy="250" r="14" fill="#38bdf8" fill-opacity="0.6" stroke="#ffffff" stroke-width="2"/>
    <circle cx="140" cy="246" r="4" fill="#ffffff"/>

    <!-- 右镜片：HUD 全息光学指示与波形 (Micro-display HUD) -->
    <path d="M 330 250 L 345 250 L 355 235 L 368 265 L 380 245 L 392 255 L 406 250" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="330" cy="225" r="3" fill="#a855f7"/>
    <line x1="338" y1="225" x2="360" y2="225" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>

    <!-- 鼻梁正中：璀璨科技 "X" 标识 (VisionX 标识) -->
    <g transform="translate(256, 226)">
      <path d="M -14 -14 L 14 14 M 14 -14 L -14 14" stroke="url(#xGrad)" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 底部品牌科技字标: VisionX -->
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#f8fafc">
    VISION<tspan fill="#38bdf8">X</tspan>
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="4" fill="#64748b">
    SMART GLASS CONSOLE
  </text>
</svg>
